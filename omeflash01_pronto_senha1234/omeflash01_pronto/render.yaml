# Blueprint do Render: backend Node.js nativo (sem Docker).
# O frontend fica no Netlify; aqui só roda a API (server.ts via tsx).
services:
  - type: web
    name: omeflash-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      # URL real do site no Netlify, ex.: https://seu-site.netlify.app (sem barra final)
      - key: CORS_ORIGIN
        sync: false
      - key: ADMIN_INITIAL_EMAIL
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: ADMIN_INITIAL_NAME
        value: Administrador Geral
    # Persistência do SQLite: o plano free tem disco efêmero (dados são perdidos a cada deploy/reinício).
    # Para manter vídeos, planos e sessões, use um plano pago, descomente abaixo e troque "plan: free" por "plan: starter":
    # disk:
    #   name: omeflash-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # e adicione a variável: DATA_DIR=/var/data
